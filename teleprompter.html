<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teleprompter flotante — Ferreycorp</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:#FAF7ED;color:#1B1A17}
  /* Caja flotante: pensada para una ventana pequeña aparte */
  .box{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:#1B1A17;color:#FAF7ED;padding:12px 16px;display:flex;align-items:center;gap:10px}
  header .dot{width:10px;height:10px;border-radius:50%;background:#E85A24;flex:0 0 10px}
  header h1{margin:0;font-size:15px;font-weight:400;font-family:system-ui,sans-serif;letter-spacing:.06em}
  header select{margin-left:auto;background:#2A2521;color:#FAF7ED;border:1px solid #555;padding:7px 9px;border-radius:8px;font-size:14px;max-width:170px}
  #partsBtn{margin:12px 18px 0;background:#fff;border:1px solid #D8CDB2;border-radius:999px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:system-ui,sans-serif;color:#1B1A17}
  #floatBtn{margin:12px 18px 0;background:#E85A24;color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:system-ui,sans-serif}
  #parts{display:none;margin:10px 18px 0;background:#fff;border:1px solid #E5DDC8;border-radius:12px;padding:10px}
  #parts.open{display:block}
  #parts button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #F0EAD9;padding:11px 8px;cursor:pointer;font-family:Georgia,serif;font-size:16px;color:#1B1A17}
  #parts button:last-child{border-bottom:none}
  #parts button.cur{background:#FFF3E8}
  #parts .n{flex:0 0 30px;height:30px;border-radius:50%;background:#E85A24;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:system-ui,sans-serif}
  main{flex:1;padding:18px 18px 12px}
  .k{font-size:12px;letter-spacing:.14em;color:#E85A24;font-family:system-ui,sans-serif;text-transform:uppercase}
  h2{font-size:26px;font-weight:400;margin:8px 0 4px;line-height:1.15}
  .sub{font-size:13px;color:#5D574D;margin:0 0 14px;font-family:system-ui,sans-serif}
  .script{font-size:22px;line-height:1.55;background:#fff;border:1px solid #E5DDC8;border-left:5px solid #E85A24;border-radius:12px;padding:18px 20px;max-height:300px;overflow-y:auto}
  .script p{margin:0 0 12px}
  .script p:last-child{margin:0}
  .trans{margin-top:14px;background:#FFF3E8;border:1px dashed #E85A24;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5}
  .trans b{color:#E85A24;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
  .controls{display:flex;align-items:center;gap:10px;margin-top:14px;background:#1B1A17;border-radius:12px;padding:10px 12px}
  .controls button{border:none;border-radius:999px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:system-ui,sans-serif}
  #playBtn{background:#E85A24;color:#fff}
  #restartBtn{background:#2A2521;color:#FAF7ED}
  .controls label{color:#FAF7ED;font-size:13px;font-family:system-ui,sans-serif;white-space:nowrap}
  .controls input[type=range]{flex:1;accent-color:#E85A24}
  footer{padding:0 18px 18px;display:flex;gap:10px}
  footer button{flex:1;border:none;border-radius:999px;padding:15px;font-size:16px;cursor:pointer;font-family:system-ui,sans-serif}
  #prev{background:#fff;border:1px solid #D8CDB2;color:#1B1A17}
  #next{background:#E85A24;color:#fff}
  .nums{padding:0 18px 18px;font-size:13px;line-height:1.6;color:#5D574D;font-family:system-ui,sans-serif}
  .nums b{color:#E85A24}
</style>
</head>
<body>
<div class="box">
  <header>
    <span class="dot"></span>
    <h1>TELEPROMPTER · FERREYCORP</h1>
    <select id="jump" aria-label="Ir al punto"></select>
  </header>
  <button id="partsBtn" type="button">☰ Partes — Portada, Directorio, Gerencia…</button>
  <button id="floatBtn" type="button">📌 Flotar — queda encima de todo</button>
  <div id="parts"></div>
  <main>
    <div class="k" id="k"></div>
    <h2 id="t"></h2>
    <p class="sub" id="s"></p>
    <div class="script" id="script"></div>
    <div class="trans" id="trans"></div>
    <div class="controls">
      <button id="playBtn" type="button">▶ Reproducir</button>
      <button id="restartBtn" type="button">Reiniciar</button>
      <label>Velocidad</label>
      <input id="speed" type="range" min="1" max="10" value="4" />
    </div>
  </main>
  <footer>
    <button id="prev" type="button">← Atrás</button>
    <button id="next" type="button">Siguiente →</button>
  </footer>
  <div class="nums"><b>8 números:</b> 102 años · S/ 7 590 M · 7 978 · 10 países · 77 % CAT · 58 % minería · EBITDA S/ 1 131 M · Utilidad S/ 489 M</div>
</div>
<script>
var PTS=[
{k:"PORTADA",t:"Portada — Juntos creamos desarrollo",s:"El video del edificio",b:["Buenos días a todos, profesora y compañeros. El día de hoy voy a presentar mi trabajo sobre la empresa Ferreycorp, una corporación peruana con una importante trayectoria en el desarrollo de los sectores de minería, construcción e industria.","Para explicar mejor su estructura, organicé la presentación como si fuera un edificio. Cada piso representa un nivel diferente de la organización, desde el Directorio hasta las operaciones. Les voy a ir mostrando qué hace cada nivel y por qué es importante.","Aquí pueden ver la estructura organizacional de Ferreycorp, representada en estos 7 cuadros. Cada cuadro es un nivel. Si entramos a cada uno, vemos qué funciones cumple, quiénes están a cargo y sus principales indicadores. Vamos a ir de arriba a abajo, desde el Directorio hasta las operaciones."],tr:"Empezamos desde arriba, desde el nivel más alto."},
{k:"PISO 06 · DIRECTORIO",t:"Directorio — Quién gobierna",s:"9 miembros · 5 de 9 independientes · 6 997 accionistas",b:["Empezamos desde arriba, desde el nivel más alto: el Directorio. Este órgano se encarga de supervisar la gestión de la empresa y orientar las decisiones más importantes.","Está conformado por nueve miembros, y cinco de ellos son independientes. También cuenta con cuatro comités, de los cuales tres están presididos por directores independientes. Esto es importante porque fortalece la supervisión, la transparencia y el buen gobierno corporativo. Además, la empresa cuenta con 6 997 accionistas. Su presidente es Andreas von Wedemeyer Knigge."],tr:"El Directorio fija el rumbo. Ahora bajamos a la Gerencia General."},
{k:"PISO 05 · GERENCIA GENERAL",t:"Gerencia General — La dirección general",s:"Mariela García Figari de Fabbri · desde 2008",b:["Ahora bajamos un piso, a la Gerencia General, que está a cargo de Mariela García Figari de Fabbri. Ella ocupa este cargo desde el año 2008 y forma parte del grupo desde 1988.","Su función principal es dirigir la organización, establecer objetivos estratégicos, tomar decisiones y supervisar el desempeño general de la empresa. Además, las nueve gerencias corporativas le reportan a ella. Por eso, este nivel conecta la dirección estratégica con las actividades que se desarrollan en los pisos de abajo."],tr:"Debajo de ella están las 9 gerencias corporativas."},
{k:"PISO 04 · GERENCIAS CORPORATIVAS",t:"Gerencias Corporativas — 9 gerencias",s:"Deuda neta / EBITDA 1,90",b:["Debajo de ella están las Gerencias Corporativas. Son nueve gerencias que se encargan de establecer políticas, supervisar actividades y orientar el funcionamiento de todo el grupo. Entre ellas tenemos Finanzas, Negocios, Recursos Humanos, Tecnología, Auditoría, Estrategia, Marketing y Comunicación.","Cada gerencia tiene responsabilidades específicas, pero todas trabajan en conjunto para alcanzar los objetivos de Ferreycorp. Les cuento un dato: su deuda neta sobre EBITDA es 1,90, un nivel prudente y que viene bajando."],tr:"Y todo el apoyo se centraliza en un solo centro."},
{k:"PISO 03 · SERVICIOS COMPARTIDOS",t:"Servicios Compartidos — 98,8 %",s:"Un solo centro de apoyo para todo el grupo",b:["Y todo ese apoyo se centraliza en el Centro de Servicios Compartidos. Su función es brindar apoyo y coordinar procesos para las diferentes empresas del grupo. Aquí hay cinco áreas principales: Legal, Auditoría, Recursos Humanos, Finanzas y Sistemas.","¿Por qué es importante? Porque permite que las subsidiarias trabajen bajo procesos comunes, en vez de que cada una funcione por su cuenta. Un dato: el 98,8 % de los colaboradores tenía objetivos alineados con sus jefes, lo que refleja la coordinación dentro de la organización."],tr:"Ahora llegamos al corazón del negocio."},
{k:"PISO 02 · PERÚ CAT Y EXTERIOR",t:"Perú CAT y Exterior — El núcleo que vende",s:"82 % · S/ 6 251 M · El globo: 10 países",b:["Ahora llegamos al corazón del negocio: Perú CAT y el exterior. En el Perú destacan Ferreyros, Unimaq, Orvisa y Ferrenergy. Ferreyros es una de las principales empresas del grupo: comercializa maquinaria y equipos, y brinda servicios de soporte. Unimaq se especializa en maquinaria ligera, Orvisa opera en la Amazonía y Ferrenergy participa en soluciones de energía.","Este bloque concentra el 82 % de las ventas, 6 251 millones de soles, y Ferreyros sola vende 5 444 millones. Afuera, en 9 países más, está el 8 %. Aquí está el 90 % del negocio.","Y para comprender mejor esta presencia internacional, miren el mapa en tres dimensiones. Este mapa nos permite identificar los países donde Ferreycorp desarrolla sus actividades. Como pueden ver, el Perú es el punto principal. También hay presencia en Guatemala, Belice, El Salvador, Nicaragua, Panamá, Honduras, Chile, Colombia y Ecuador, y en Estados Unidos con Forbis Logistics. En total, el grupo tiene presencia en 10 países. Si pulsan un pin, ven la subsidiaria de ese país."],tr:"Pero no todo es CAT. Hay un bloque que debería diversificar."},
{k:"PISO 01 · COMPLEMENTARIOS",t:"Complementarios — La pata débil",s:"9 % · S/ 699 M · Cayó 2,0 % en 2024",b:["Pero no todo es CAT. En este nivel están las subsidiarias complementarias: Soltrak, Fargoline, Forbis Logistics y Vixora. Cada una desarrolla actividades diferentes que complementan los servicios del grupo. Soltrak trabaja con productos de Chevron y Goodyear, Fargoline con depósitos aduaneros, Forbis con logística internacional y Vixora con soluciones tecnológicas.","Según los resultados de 2024, este grupo representó el 9 % de las ventas, con 699 millones de soles. Es la pata débil: el bloque creado para diversificar fue el que menos creció, y en 2024 cayó 2 %."],tr:"Y todo esto se sostiene sobre la operación, la planta baja."},
{k:"PLANTA BAJA · OPERACIONES",t:"Operaciones — La red sostiene",s:">40 sucursales · 2 CRC · ~1 700 técnicos · La maquinaria",b:["Y todo esto se sostiene sobre la operación, la planta baja, que es la base de Ferreycorp. Aquí están las actividades que permiten que el negocio funcione día a día: más de 40 sucursales, 2 centros de reconstrucción de clase mundial, 15 talleres y unos 1 700 técnicos brindando soporte. También hay más de 6 500 máquinas conectadas, lo que permite hacer seguimiento a los equipos. Y usan tecnologías como CDR y MineStar, que ayudan a automatizar procesos y monitorear maquinaria. Por ejemplo, el 65 % de las extracciones del CDR son automatizadas. También se registran más de 30 unidades por día. Esto demuestra cómo la tecnología permite mejorar la eficiencia de las operaciones.","Y aquí vive la maquinaria. Miren el motor V8: es un modelo interactivo que se puede girar y ver desde diferentes ángulos. Es un motor de cuatro tiempos, de 5,8 litros y ocho cilindros en V, que se desarma pieza por pieza para ver cómo trabajan sus componentes. Y el cargador de ruedas CAT: se usa en construcción y movimiento de materiales, tiene 1 792 componentes en ocho grupos, y se puede controlar su articulación, el brazo y el cucharón. Esto muestra que la venta de maquinaria también requiere mantenimiento, repuestos y servicio técnico."],tr:"Con esto claro, les digo la idea central."},
{k:"LA TESIS",t:"Diagnóstico — Fortaleza y riesgo",s:"La doble concentración: CAT 77 % + minería 58 %",b:["Para complementar, veamos los resultados de 2024. Ferreycorp registró ventas por 7 590 millones de soles, con un crecimiento de 8,5 %. También obtuvo un EBITDA de 1 131 millones de soles y una utilidad neta de 489 millones.","Son resultados importantes, pero hay que ver el otro lado: existe una concentración fuerte. Caterpillar representa el 77 % de los ingresos y el sector minero el 58 %. Esa es la idea central de mi trabajo: la doble concentración. Es su mayor fortaleza y su mayor riesgo a la vez, porque si la minería se frena, todo se frena."],tr:"Por eso el plan no abandona Caterpillar: baja la vulnerabilidad."},
{k:"EL PLAN",t:"Plan de acción — 6 acciones, 3 años",s:"Bajar la vulnerabilidad sin soltar el liderazgo",b:["Por eso el plan de acción no abandona Caterpillar: lo que hace es bajar la vulnerabilidad. Es un plan a 3 años: subir los ingresos recurrentes y los sectores que no son minería, sin perder el liderazgo en la gran minería.","Son seis acciones: venta cruzada, contratos de servicio recurrentes, electrificación, crecer fuera de minería, blindaje financiero y ampliar la cantera técnica. Y cada una aprovecha una oportunidad del entorno: la electrificación aprovecha la transición energética, crecer fuera de minería aprovecha la construcción y la agroindustria, y los contratos recurrentes aprovechan que los clientes quieren servicio continuo, no solo comprar la máquina."],tr:"Y para cerrar, las ideas que quedan."},
{k:"CIERRE",t:"Cierre — Juntos creamos desarrollo",s:"6 ideas que quedan",b:["En conclusión, después de analizar la estructura de Ferreycorp, puedo decir que su funcionamiento depende de la coordinación entre sus operaciones, subsidiarias, áreas corporativas y órganos de dirección. También vimos la importancia de la tecnología, la maquinaria, los recursos humanos y la presencia internacional.","Finalmente, esta presentación me permitió conocer cómo se organiza una corporación y cómo cada nivel cumple una función importante para alcanzar sus objetivos. Juntos creamos desarrollo. Muchas gracias por su atención, quedo atento a sus preguntas."],tr:"Gracias. Quedo atento a sus preguntas."},
{k:"PREGUNTA · OPORTUNIDADES",t:"Si preguntan: oportunidades del entorno",s:"Respuesta lista para la pregunta del jurado",b:["Las oportunidades del entorno que Ferreycorp está aprovechando son cinco. Primero, el crecimiento de la minería y la demanda de cobre, que sigue impulsando la venta de maquinaria. Segundo, la electrificación y la transición energética, que abren un mercado nuevo de equipos eléctricos. Tercero, la inversión en infraestructura y construcción. Cuarto, la expansión internacional en Centroamérica y Estados Unidos. Y quinto, la digitalización y automatización, con tecnologías como MineStar y las máquinas conectadas.","El plan de acción justamente aprovecha estas oportunidades: con la electrificación, con crecer fuera de minería y con los contratos de servicio recurrentes, que convierten cada venta en un ingreso continuo."],tr:"Si no preguntan, no se lee. Es solo respaldo."},
{k:"PREGUNTA · PLAN EN PAPEL",t:"Si preguntan: que el plan no quede en papel",s:"Respuesta lista para la pregunta del jurado",b:["Para que el plan no se quede solo en papel, hay que ponerle cuatro cosas. Primero, un responsable por cada acción: cada una de las seis acciones tiene una gerencia a cargo, y la Gerencia General supervisa el conjunto.","Segundo, plazos e indicadores medibles: por ejemplo, subir el porcentaje de ingresos no mineros y el porcentaje de ingresos recurrentes, con metas por año dentro de los 3 años. Tercero, presupuesto: cada acción tiene recursos asignados, no es solo una idea.","Y cuarto, seguimiento: revisión trimestral en la Gerencia General y en el Directorio, y empezar con un piloto, por ejemplo la electrificación en una mina, antes de escalarlo a todo el grupo. Así el plan se mide, se corrige y se cumple."],tr:"Si no preguntan, no se lee. Es solo respaldo."}
];
var cur=0, jump=document.getElementById('jump'), partsBox=document.getElementById('parts');
PTS.forEach(function(p,i){
  var o=document.createElement('option'); o.value=i; o.textContent=(i+1)+'. '+p.t; jump.appendChild(o);
  var b=document.createElement('button'); b.type='button';
  b.innerHTML='<span class="n">'+(i+1)+'</span><span>'+p.t+'</span>';
  b.onclick=function(){ show(i); partsBox.classList.remove('open'); };
  partsBox.appendChild(b);
});
document.getElementById('partsBtn').onclick=function(){ partsBox.classList.toggle('open'); };
function show(i){
  cur=i; var p=PTS[i];
  document.getElementById('k').textContent=(i+1)+' de '+PTS.length+' · '+p.k;
  document.getElementById('t').textContent=p.t;
  document.getElementById('s').textContent=p.s;
  document.getElementById('script').innerHTML=p.b.map(function(x){return '<p>'+x+'</p>';}).join('');
  document.getElementById('trans').innerHTML='<b>'+(i+1<PTS.length?'Para pasar al siguiente punto':'Al terminar')+'</b>'+p.tr;
  document.getElementById('prev').style.visibility=i>0?'visible':'hidden';
  document.getElementById('next').textContent=i+1<PTS.length?'Siguiente →':'Terminar';
  jump.value=i; window.scrollTo(0,0);
  Array.prototype.forEach.call(partsBox.children,function(el,idx){ el.classList.toggle('cur', idx===i); });
}
jump.onchange=function(){ stopScroll(); show(+jump.value); };
document.getElementById('next').onclick=function(){ stopScroll(); if(cur+1<PTS.length) show(cur+1); };
document.getElementById('prev').onclick=function(){ stopScroll(); if(cur>0) show(cur-1); };
// Auto-scroll estilo floating teleprompter: el texto baja solo, pausa y reinicio
var scrollTimer=null, playing=false;
var scriptBox=document.getElementById('script');
var playBtn=document.getElementById('playBtn');
function speedPx(){ return +document.getElementById('speed').value * 0.6; }
function tick(){
  if(!playing) return;
  scriptBox.scrollTop += speedPx();
  if(scriptBox.scrollTop + scriptBox.clientHeight >= scriptBox.scrollHeight - 2){
    stopScroll();
    if(cur+1<PTS.length){ show(cur+1); startScroll(); }
    return;
  }
  scrollTimer=setTimeout(tick, 50);
}
function startScroll(){ playing=true; playBtn.textContent='⏸ Pausa'; tick(); }
function stopScroll(){ playing=false; playBtn.textContent='▶ Reproducir'; if(scrollTimer){ clearTimeout(scrollTimer); scrollTimer=null; } }
playBtn.onclick=function(){ playing ? stopScroll() : startScroll(); };
document.getElementById('restartBtn').onclick=function(){ stopScroll(); scriptBox.scrollTop=0; show(0); };
// Ventana flotante que queda ENCIMA de todo (WhatsApp, la página, lo que sea):
// usa Picture-in-Picture del navegador. Botón «📌 Flotar».
var pipWin=null;
function renderPip(){
  if(!pipWin || pipWin.closed){ pipWin=null; return; }
  var p=PTS[cur], d=pipWin.document;
  d.getElementById('pk').textContent=(cur+1)+' de '+PTS.length+' · '+p.k;
  d.getElementById('pt').textContent=p.t;
  d.getElementById('ps').innerHTML=p.b.map(function(x){return '<p>'+x+'</p>';}).join('');
  d.getElementById('ptr').textContent=p.tr;
  d.getElementById('pprev').style.visibility=cur>0?'visible':'hidden';
  d.getElementById('pnext').textContent=cur+1<PTS.length?'Siguiente →':'Terminar';
}
document.getElementById('floatBtn').onclick=async function(){
  if(!('documentPictureInPicture' in window)){ alert('Este navegador no tiene ventana flotante. Usa Chrome o Edge.'); return; }
  if(pipWin && !pipWin.closed){ pipWin.focus(); return; }
  try{
    pipWin = await documentPictureInPicture.requestWindow({width:420, height:620});
  }catch(err){ return; }
  var d=pipWin.document;
  d.title='Teleprompter flotante — Ferreycorp';
  d.body.style.cssText='margin:0;font-family:Georgia,serif;background:#1B1A17;color:#FAF7ED';
  d.body.innerHTML=
    '<div style="padding:16px">'+
    '<div id="pk" style="font-size:12px;letter-spacing:.14em;color:#E85A24;font-family:system-ui,sans-serif"></div>'+
    '<h2 id="pt" style="font-size:24px;font-weight:400;margin:8px 0"></h2>'+
    '<div id="ps" style="font-size:21px;line-height:1.55;background:#fff;color:#1B1A17;border-radius:12px;padding:16px 18px"></div>'+
    '<div style="margin-top:12px;background:#2A2521;border:1px dashed #E85A24;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5"><b style="color:#E85A24;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;display:block">PARA PASAR AL SIGUIENTE PUNTO</b><span id="ptr"></span></div>'+
    '<div style="display:flex;gap:10px;margin-top:14px">'+
    '<button id="pprev" type="button" style="flex:1;border:1px solid #555;background:#2A2521;color:#FAF7ED;border-radius:999px;padding:13px;font-size:15px">← Atrás</button>'+
    '<button id="pnext" type="button" style="flex:1;border:none;background:#E85A24;color:#fff;border-radius:999px;padding:13px;font-size:15px">Siguiente →</button>'+
    '</div></div>';
  d.getElementById('pprev').onclick=function(){ if(cur>0){ stopScroll(); show(cur-1); } };
  d.getElementById('pnext').onclick=function(){ if(cur+1<PTS.length){ stopScroll(); show(cur+1); } };
  pipWin.addEventListener('pagehide', function(){ pipWin=null; });
  renderPip();
};
// Cada vez que cambia el punto, la ventana flotante se actualiza sola
var _show=show;
show=function(i){ _show(i); renderPip(); };
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'&&cur+1<PTS.length) show(cur+1);
  if(e.key==='ArrowLeft'&&cur>0) show(cur-1);
});
show(0);
</script>
</body>
</html>
