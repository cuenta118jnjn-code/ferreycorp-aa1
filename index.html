<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferreycorp S.A.A. — Juntos creamos desarrollo · AA1 Administración de Negocios</title>
<style>
:root{
  --cream:#FAF7ED; --ink:#1B1A17; --ink-soft:#5D574D; --orange:#E85A24;
  --orange-dark:#C74312;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#FBF8F1 0%,#F5EEE0 100%) url("poster.jpg") center/cover no-repeat}
.hero video.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:68% 50%;z-index:0}
.hero .veil{position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,rgba(251,248,241,.97) 0%,rgba(248,244,233,.92) 30%,
    rgba(248,244,233,.55) 55%,rgba(248,244,233,.22) 78%,rgba(248,244,233,.10) 100%);}
.hero .veil-bottom{position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(250,247,237,.85) 0%,rgba(250,247,237,0) 28%)}
.topbar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding:28px 48px 0}
.brand{font-weight:400;letter-spacing:.28em;font-size:14px;color:var(--ink-soft)}
.btn-sound{background:none;border:none;cursor:pointer;font-size:24px;line-height:1;
  padding:6px;color:var(--ink-soft);font-family:inherit}
.btn-sound:hover{color:var(--ink)}
.btn-sound[aria-pressed="true"]{color:var(--orange)}
.main{position:relative;z-index:3;flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);
  gap:48px;align-items:center;padding:24px 48px 8px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;
  font-size:clamp(56px,7.6vw,110px);line-height:1.06;letter-spacing:-.01em;color:var(--ink)}
h1 em{font-style:italic;color:var(--ink)}
.sub{margin-top:28px;font-size:clamp(17px,1.5vw,21px);line-height:1.5;color:var(--ink-soft)}
.btn-solid{display:inline-block;margin-top:30px;background:var(--orange);color:#fff;border-radius:999px;
  padding:15px 30px;font-size:15.5px;font-weight:600;text-decoration:none;
  box-shadow:0 10px 24px rgba(232,90,36,.30)}
.btn-solid:hover{background:var(--orange-dark)}
.card{justify-self:end;background:#FFFDF8;border-radius:16px;padding:34px 40px 30px;width:100%;max-width:300px;
  box-shadow:0 16px 40px rgba(27,26,23,.10);border:1px solid rgba(27,26,23,.06)}
.card .big{font-family:Georgia,serif;font-size:88px;line-height:1;font-weight:400;color:var(--ink)}
.card .big small{font-size:52px;font-weight:400}
.card .cap{margin-top:14px;font-size:17px;color:var(--ink)}
.nums{position:relative;z-index:3;display:flex;justify-content:space-between;flex-wrap:wrap;
  gap:16px 40px;padding:20px 48px 26px}
.nums span{font-family:Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:400;color:var(--ink)}
.nums span i{font-style:normal;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:.62em;color:var(--ink-soft);margin-left:2px}
.credit{position:relative;z-index:3;text-align:center;padding:0 0 10px;font-size:10px;letter-spacing:.03em;color:var(--ink-soft)}
.credit a{color:var(--ink-soft)}
@media (max-width:900px){
  .topbar{padding:20px 22px 0}
  .main{grid-template-columns:1fr;gap:26px;padding:24px 22px 4px;align-content:center}
  .card{justify-self:start;max-width:300px;padding:26px 30px 24px}
  .card .big{font-size:72px}
  .card .big small{font-size:44px}
  .nums{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;padding:16px 22px 20px}
  .hero video.bg{object-position:72% 50%}
  .hero .veil{background:linear-gradient(100deg,rgba(251,248,241,.97) 0%,rgba(248,244,233,.93) 55%,
    rgba(248,244,233,.60) 100%)}
}
</style>
</head>
<body>
<section class="hero">
  <video class="bg" autoplay muted loop playsinline
    poster="poster.jpg"
    src="hero.mp4"></video>
  <div class="veil"></div>
  <div class="veil-bottom"></div>

  <header class="topbar">
    <div class="brand">FERREYCORP &nbsp;·&nbsp; AA1</div>
    <button class="btn-sound" id="btnSonido" aria-pressed="false" title="Activar la música de la portada">🔇</button>
  </header>

  <div class="main">
    <div>
      <h1>Juntos<br>creamos <em>desarrollo</em></h1>
      <p class="sub">Ferreycorp S.A.A. por dentro.</p>
      <a class="btn-solid" href="#edificio">Entrar al edificio</a>
    </div>
    <aside class="card">
      <div class="big">77<small> %</small></div>
      <div class="cap">Caterpillar</div>
    </aside>
  </div>

  <div class="nums">
    <span>102 <i>años</i></span>
    <span>S/ 7 590 <i>M</i></span>
    <span>7 978</span>
    <span>10 <i>países</i></span>
  </div>
  <p class="credit">Música: «Meanwhile» de Scott Buckley — CC-BY 4.0 · scottbuckley.com.au</p>
</section>
<audio id="musica" src="musica.mp3" loop preload="none"></audio>
<script>
// La música NUNCA suena sola: solo suena si el visitante pulsa el icono de sonido.
var btn = document.getElementById('btnSonido');
var audio = document.getElementById('musica');
audio.volume = 0.7;
btn.addEventListener('click', function(){
  if (audio.paused) {
    audio.play().then(function(){
      btn.setAttribute('aria-pressed', 'true');
      btn.textContent = '🔊';
    }).catch(function(){ /* el navegador bloqueó el audio: queda en silencio */ });
  } else {
    audio.pause();
    btn.setAttribute('aria-pressed', 'false');
    btn.textContent = '🔇';
  }
});
// La música es SOLO de la portada: al bajar fuera del hero, se apaga sola
// y el botón vuelve a silencio (el resto de la página siempre es silencio).
var hero = document.querySelector('.hero');
if ('IntersectionObserver' in window) {
  new IntersectionObserver(function(entries){
    if (!entries[0].isIntersecting && !audio.paused) {
      audio.pause();
      btn.setAttribute('aria-pressed', 'false');
      btn.textContent = '🔇';
    }
  }, {threshold: 0.15}).observe(hero);
}
// Si el video no carga, queda el póster como fondo (ya está en el CSS del hero).
document.querySelector('video.bg').addEventListener('error', function(){ this.style.display='none'; });
</script>
</body>
</html>
